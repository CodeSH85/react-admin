services:
  postgres:
    image: postgres:16-alpine
    container_name: blueprint-base-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: blueprint-base-admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  blueprint-base:
    image: blueprint-base:latest
    build:
      context: .
      dockerfile: src/Services/Part/dockerfile
    ports:
      - "5001:8080"
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "6868:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - blueprint-base
volumes:
  postgres_data:
