events { 
    worker_connections 1024;
}

http {
    # Define the group of servers Nginx should route traffic to
    upstream dotnet_api {
        # 'blueprint-base' matches the service name in docker-compose.yml
        # Port 80 is the default internal port for ASP.NET 10.0 containers
        server blueprint-base:8080;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass         http://dotnet_api;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host $server_name;
        }
    }
}
